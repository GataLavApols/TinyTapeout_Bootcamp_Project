# Tiny Tapeout project information
project:
  title: "Tabletop TCG Companion"
  author: "Hans Sese"
  discord: "" 
  description: "A hardware assistant for tabletop game hobbyists that replaces physical dice and counters with a single hardware device."
  language: "Verilog" 
  clock_hz: 0 
  tiles: "1x1" 
  top_module: "tt_um_GataLavApols_tcg_companion"
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Add 10 Damage (Button)"
  ui[1]: "Subtract 10 Damage (Button)"
  ui[2]: "Coin Flip (Hold/Release)"
  ui[3]: "Reset Damage Counters"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Segment A (Damage Counter)"
  uo[1]: "Segment B (Damage Counter)"
  uo[2]: "Segment C (Damage Counter)"
  uo[3]: "Segment D (Damage Counter)"
  uo[4]: "Segment E (Damage Counter)"
  uo[5]: "Segment F (Damage Counter)"
  uo[6]: "Segment G (Damage Counter)"
  uo[7]: "Coin Flip Result (LED)"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
